name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit

      - name: Ruff (blocking: syntax/import runtime rules)
        run: ruff check . --select E9,F63,F7,F82

      - name: Ruff (non-blocking: full report)
        continue-on-error: true
        run: ruff check .

      - name: Bandit (blocking: medium/high severity only)
        run: bandit -r app frontend ml -q -ll

      - name: Bandit (non-blocking: full report)
        continue-on-error: true
        run: bandit -r app frontend ml tests -q

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

      - name: Build Docker image
        run: docker build -t nutriwell:ci .